robot:
  h_com: 0.38
  g: 9.81
  m: 24.24
  Iz: 1.048
  off_x: 0.2407
  off_y: 0.134
  mu: 0.8
  max_ext_sq: 0.0625  # 0.25 * 0.25
  x_init: [-0.8, -0.5]
  theta_init: 0.0

limits:
  dt_min: 0.1
  dt_max: 0.25
  theta_dot_max: 0.6
  v_max_x: 1.5
  v_max_y: 0.45
  alpha_min: 0.1
  alpha_max: 0.9

ocp_weights:
  tracking_xy: 5.0
  vel_alignment: 10.0
  vel_xy: 5.0
  yaw_rate: 1.0
  anti_skating: 10.0
  posture: 10000.0   # 1e4
  alpha_weight: 1.0
  dt_weight: 0.001   # 1e-3

simulation:
  N_horizon: 7
  sim_steps: 100
  step_per_phase: 1
  c_target: [1.0, 0.2]

obstacles:
  obs_pos_init: [0.1, 1.0]
  r_obs: 0.2
  speed: 0.5
  y_dot_max: 1.0
  top_pos_dyn: [0.1, 1.0]
  bot_pos_dyn: [0.1, -1.0]
  obs_type: "dynamic" # static, dynammic, adversarial, circular
  obs_center: [1.0, 0.2]